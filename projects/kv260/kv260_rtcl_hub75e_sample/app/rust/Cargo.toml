[package]
name = "kv260_rtcl_hub75e_sample"
version = "0.1.0"
edition = "2021"

[dependencies]
jelly-mem_access = "0.2.7"
jelly-lib = "0.2.2"
jelly-pac = "0.1.2"
jelly-fpgautil = {git="https://github.com/ryuz/jelly-fpgautil-rs.git", tag="v0.0.2"}
rtcl-lib = { path = "../../../../../rust/lib" }
opencv = { version = "0.93.5", optional = true }
chrono = { version = "0.4.44", features = ["clock", "std"] }
ctrlc = "3.5.2"
clap = { version = "4.6.1", features = ["derive"] }

[features]
default = ["std", "opencv"]
std = []
